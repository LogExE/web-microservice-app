apiVersion: v1
kind: Pod
metadata:
  name: web-go
spec:
  containers:
    - name: rest
      image: &mega_img ghcr.io/logexe/web-microservice-app:master
      command: ["rest"]
      env:
        - name: GIN_MODE
          value: "release"
        - name: REST_ADDR
          value: "0.0.0.0:8080"
      ports:
        - containerPort: 8080
          hostPort: 8080
    - name: filter
      image: *mega_img
      command: ["filter"]
    - name: notifications
      image: *mega_img
      command: ["notifications"]
    - name: broker
      image: apache/kafka:3.9.1
